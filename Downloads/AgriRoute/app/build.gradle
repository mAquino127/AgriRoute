plugins {
    id 'com.android.application'
}

// ---- API keys: read from local.properties (git-ignored) or environment variables ----
def localProps = new Properties()
def localFile = rootProject.file("local.properties")
if (localFile.exists()) {
    localFile.withInputStream { localProps.load(it) }
}
def secret = { String name ->
    String v = localProps.getProperty(name)
    if (v == null || v.trim().isEmpty()) v = System.getenv(name)
    return (v == null ? "" : v.trim().replace("\\", "\\\\").replace("\"", "\\\""))
}

android {
    namespace 'com.gagambytes.agriroute'
    compileSdk 35

    defaultConfig {
        applicationId "com.gagambytes.agriroute"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        buildConfigField "String", "TOMTOM_API_KEY", "\"${secret('TOMTOM_API_KEY')}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.fragment:fragment:1.8.5'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
